<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendário de provas 2026.2 – Agronomia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14231a; --ink-soft:#4a5d4f; --paper:#f6f9f2; --surface:#ffffff; --line:#d5e3cb;
  --forest:#003300; --forest-ink:#ffffff; --leaf:#c5dfb3; --leaf-ink:#0f2a12; --focus:#0a6b16; --today:#b45309;
  --font-head:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --font-body:"Source Sans 3","Segoe UI",Roboto,Arial,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ink:#e6efe0; --ink-soft:#a8bda6; --paper:#0d160f; --surface:#152119; --line:#2a3d2e;
    --forest:#0b3d12; --forest-ink:#ffffff; --leaf:#2f4d2a; --leaf-ink:#e6f2dc; --focus:#8fd47a; --today:#f0a55a;
  }
}
:root[data-theme="dark"]{
  --ink:#e6efe0; --ink-soft:#a8bda6; --paper:#0d160f; --surface:#152119; --line:#2a3d2e;
  --forest:#0b3d12; --forest-ink:#ffffff; --leaf:#2f4d2a; --leaf-ink:#e6f2dc; --focus:#8fd47a; --today:#f0a55a;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 1rem/1.5 var(--font-body);-webkit-text-size-adjust:100%}
.wrap{max-width:60rem;margin:0 auto;padding:1rem 1rem 3rem}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}

.brand{background:#fff;border-radius:10px;padding:.6rem .9rem;display:flex;align-items:center;justify-content:space-between;gap:1rem;border:1px solid var(--line)}
.brand img{display:block;width:100%;max-width:26rem;height:auto}

h1{font:700 clamp(1.9rem,6vw,2.9rem)/1.02 var(--font-head);letter-spacing:.005em;margin:1.4rem 0 .25rem}
.sub{margin:0 0 1.2rem;color:var(--ink-soft)}

.hero{background:var(--forest);color:var(--forest-ink);border-radius:14px;padding:1.2rem 1.25rem 1.3rem}
.hero .when{font:600 1.05rem/1.2 var(--font-body);opacity:.92;margin:0}
.hero .day{font:700 clamp(2.1rem,7.5vw,3.4rem)/1.02 var(--font-head);margin:.15rem 0 .8rem}
.hero ul{list-style:none;margin:0;padding:0;display:grid;gap:.45rem}
.hero li{display:grid;grid-template-columns:4.2rem 1fr auto;gap:.7rem;align-items:baseline;border-top:1px solid rgba(255,255,255,.22);padding-top:.5rem}
.hero .t{font:700 1.25rem/1 var(--font-head)}
.hero .n{font-weight:600}
.hero .msg{margin:0;font-size:1.05rem}

.controls{display:grid;gap:.8rem;margin:1.4rem 0 1rem}
.row{display:flex;flex-wrap:wrap;gap:.5rem;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--forest);border-radius:10px;overflow:hidden;background:var(--surface)}
.seg button{font:600 .95rem var(--font-body);color:var(--forest);background:transparent;border:0;padding:.55rem .9rem;min-height:44px;cursor:pointer}
.seg button+button{border-left:1.5px solid var(--forest)}
.seg button[aria-pressed="true"]{background:var(--forest);color:var(--forest-ink)}
:root[data-theme="dark"] .seg,:root[data-theme="dark"] .seg button+button{border-color:var(--focus)}
:root[data-theme="dark"] .seg button{color:var(--focus)}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{background:var(--focus);color:#0d160f}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .seg,:root:not([data-theme="light"]) .seg button+button{border-color:var(--focus)}
  :root:not([data-theme="light"]) .seg button{color:var(--focus)}
  :root:not([data-theme="light"]) .seg button[aria-pressed="true"]{background:var(--focus);color:#0d160f}
}
.search{flex:1 1 14rem;min-height:44px;font:400 1rem var(--font-body);color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:.5rem .8rem}
.search::placeholder{color:var(--ink-soft)}
.count{margin:0;color:var(--ink-soft);font-size:.95rem}

.days{display:grid;gap:.9rem}
.day-block{display:grid;grid-template-columns:5.4rem 1fr;background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.day-block.past{opacity:.55}
.dl{background:var(--leaf);color:var(--leaf-ink);padding:.7rem .4rem;text-align:center;display:flex;flex-direction:column;justify-content:center}
.dl .num{font:700 2rem/1 var(--font-head)}
.dl .wd{font-size:.85rem;font-weight:600;line-height:1.2}
.dl .hoje{margin-top:.3rem;font-size:.75rem;font-weight:700;color:var(--forest-ink);background:var(--today);border-radius:99px;padding:.05rem .45rem;align-self:center}
.ex{list-style:none;margin:0;padding:0}
.ex li{display:grid;grid-template-columns:3.6rem 1fr auto;gap:.6rem;align-items:baseline;padding:.65rem .9rem}
.ex li+li{border-top:1px solid var(--line)}
.ex .t{font:700 1.2rem/1 var(--font-head)}
.ex .n{font-weight:600}
.badge{font:700 .85rem/1 var(--font-head);letter-spacing:.02em;background:var(--forest);color:var(--forest-ink);border-radius:6px;padding:.28rem .5rem;white-space:nowrap}
.hero .badge{background:var(--leaf);color:var(--leaf-ink)}
:root[data-theme="dark"] .badge{background:var(--leaf);color:var(--leaf-ink)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{background:var(--leaf);color:var(--leaf-ink)}}

.gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table.wk{border-collapse:collapse;width:100%;min-width:46rem;table-layout:fixed}
.wk th{background:var(--forest);color:var(--forest-ink);font:700 1.05rem var(--font-head);padding:.5rem;text-align:center}
.wk th.wl{width:5.6rem}
.wk td{vertical-align:top;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:.35rem;height:6rem}
.wk td.wlab{background:var(--leaf);color:var(--leaf-ink);font:700 .95rem/1.2 var(--font-head);text-align:center;vertical-align:middle;border-left:0}
.wk .dn{font:600 .8rem var(--font-body);color:var(--ink-soft);margin-bottom:.2rem}
.wk td.out{background:repeating-linear-gradient(135deg,transparent 0 6px,rgba(127,160,120,.10) 6px 12px)}
.wk td.is-today{outline:3px solid var(--today);outline-offset:-3px}
.chip{display:block;font-size:.82rem;line-height:1.2;border-left:4px solid var(--forest);background:var(--paper);padding:.25rem .35rem;margin-bottom:.3rem;border-radius:0 5px 5px 0}
.chip b{font-family:var(--font-head);font-size:.95rem}
.chip i{font-style:normal;font-weight:700;color:var(--ink-soft)}
:root[data-theme="dark"] .chip{border-left-color:var(--focus)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .chip{border-left-color:var(--focus)}}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:1.4rem;text-align:center;color:var(--ink-soft)}
.foot{margin-top:2rem;color:var(--ink-soft);font-size:.9rem}
@media (max-width:30rem){
  .day-block{grid-template-columns:4.4rem 1fr}
  .ex li{grid-template-columns:3.3rem 1fr;}
  .ex li .badge{grid-column:2;justify-self:start}
  .hero li{grid-template-columns:3.6rem 1fr}
  .hero li .badge{grid-column:2;justify-self:start}
}
@media print{
  body{background:#fff;color:#000}.controls,.brand+h1~.noprint{display:none}
  .hero{background:#fff;color:#000;border:1px solid #000}.hero .badge{border:1px solid #000}
  .day-block{break-inside:avoid;border-color:#999}.day-block.past{opacity:1}
}
</style>
</head>

[6,"Fitopatologia I","2026-10-05","19:15"],[6,"Atividade Extensionista VI","2026-10-06","19:15"],
[6,"Manejo de Bacias Hidrográficas","2026-10-07","19:15"],[6,"Vistoria, Avaliação e Perícia Aplicada a Agronomia","2026-10-07","21:00"],
[6,"Biologia dos Solos Tropicais","2026-10-08","19:15"],[6,"Logística e Pós-Colheita","2026-10-09","19:15"],
[8,"Atividade Extensionista VIII","2026-10-03","13:00"],[8,"TCC 2","2026-10-03","15:00"],[8,"Orientação de Estágio","2026-10-24","13:00"]
].map(function(a){var p=a[2].split("-");return{p:a[0],n:a[1],date:new Date(+p[0],+p[1]-1,+p[2]),t:a[3]}});
E.sort(function(a,b){return a.date-b.date||a.t.localeCompare(b.t)||a.p-b.p});

var WD=["domingo","segunda-feira","terça-feira","quarta-feira","quinta-feira","sexta-feira","sábado"];
var WS=["dom","seg","ter","qua","qui","sex","sáb"];
var now=new Date(), today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
var st={p:"all",q:"",v:"list"};
var $=function(id){return document.getElementById(id)};
function ft(t){return t.replace(":","h")}
function dd(d){return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")}
function norm(s){return s.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function same(a,b){return a.getTime()===b.getTime()}
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function diff(d){return Math.round((d-today)/864e5)}
function rel(n){return n===0?"hoje":n===1?"amanhã":"em "+n+" dias"}
function filtered(){
  var q=norm(st.q.trim());
  return E.filter(function(e){return (st.p==="all"||e.p===st.p)&&(!q||norm(e.n).indexOf(q)>-1)});
}
function group(list){
  var m=[];list.forEach(function(e){var l=m[m.length-1];if(l&&same(l.d,e.date))l.items.push(e);else m.push({d:e.date,items:[e]})});return m;
}
function hero(list){
  var up=list.filter(function(e){return e.date>=today});
  var h=$("hero");
  if(!up.length){
    h.innerHTML='<p class="msg">'+(list.length?"As provas deste filtro já aconteceram.":"Nenhuma prova encontrada para este filtro.")+'</p>';return;
  }
  var d=up[0].date, items=up.filter(function(e){return same(e.date,d)});
  var who=st.p==="all"?"Próximas provas":"Próxima prova do "+st.p+"º período";
  if(items.length===1&&st.p!=="all")who="Próxima prova do "+st.p+"º período";
  h.innerHTML='<p class="when">'+who+", "+rel(diff(d))+'</p><p class="day">'+WD[d.getDay()]+", "+dd(d)+'</p><ul>'+
    items.map(function(e){return '<li><span class="t">'+ft(e.t)+'</span><span class="n">'+esc(e.n)+'</span><span class="badge">'+e.p+'º período</span></li>'}).join("")+'</ul>';
}
function listView(list){
  if(!list.length)return '<div class="empty">Nenhuma disciplina encontrada. Tente outro nome ou escolha “Todos”.</div>';
  return '<div class="days">'+group(list).map(function(g){
    var past=g.d<today, isT=same(g.d,today);
    return '<div class="day-block'+(past?" past":"")+'"><div class="dl"><span class="num">'+String(g.d.getDate()).padStart(2,"0")+'</span><span class="wd">'+WD[g.d.getDay()]+'</span>'+(isT?'<span class="hoje">hoje</span>':'')+'</div><ul class="ex">'+
      g.items.map(function(e){return '<li><span class="t">'+ft(e.t)+'</span><span class="n">'+esc(e.n)+'</span><span class="badge">'+e.p+'º período</span></li>'}).join("")+'</ul></div>';
  }).join("")+'</div>';
}
function monday(d){var x=new Date(d);var k=(x.getDay()+6)%7;x.setDate(x.getDate()-k);return x}
function weekView(list){
  if(!list.length)return '<div class="empty">Nenhuma disciplina encontrada. Tente outro nome ou escolha “Todos”.</div>';
  var ms=[];list.forEach(function(e){var m=monday(e.date);if(!ms.some(function(x){return same(x,m)}))ms.push(m)});
  ms.sort(function(a,b){return a-b});
  var rows=ms.map(function(m){
    var sat=new Date(m);sat.setDate(sat.getDate()+5);
    var tds="";
    for(var i=0;i<6;i++){
      var d=new Date(m);d.setDate(d.getDate()+i);
      var its=list.filter(function(e){return same(e.date,d)});
      tds+='<td class="'+(its.length?"":"out")+(same(d,today)?" is-today":"")+'"><div class="dn">'+dd(d)+'</div>'+
        its.map(function(e){return '<span class="chip"><b>'+ft(e.t)+'</b> <i>'+e.p+'º</i><br>'+esc(e.n)+'</span>'}).join("")+'</td>';
    }
    return '<tr><td class="wlab">'+dd(m)+" a<br>"+dd(sat)+'</td>'+tds+'</tr>';
  }).join("");
  return '<div class="gridwrap"><table class="wk"><thead><tr><th class="wl">Semana</th><th>Seg</th><th>Ter</th><th>Qua</th><th>Qui</th><th>Sex</th><th>Sáb</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
}
function render(){
  var list=filtered();
  hero(list);
  $("count").textContent=list.length+(list.length===1?" prova":" provas")+(st.p==="all"?" em todos os períodos":" no "+st.p+"º período");
  $("out").innerHTML=st.v==="list"?listView(list):weekView(list);
}
var per=$("periodos");
[["all","Todos"],[2,"2º"],[4,"4º"],[6,"6º"],[8,"8º"]].forEach(function(o){
  var b=document.createElement("button");b.type="button";b.textContent=o[1];b.dataset.p=o[0];
  b.setAttribute("aria-pressed",String(o[0]==="all"));
  b.setAttribute("aria-label",o[0]==="all"?"Todos os períodos":"Período "+o[1]);
  per.appendChild(b);
});
per.addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  st.p=b.dataset.p==="all"?"all":+b.dataset.p;
  Array.prototype.forEach.call(per.children,function(x){x.setAttribute("aria-pressed",String(x===b))});
  render();
});
$("views").addEventListener("click",function(ev){
  var b=ev.target.closest("button");if(!b)return;
  st.v=b.dataset.v;
  Array.prototype.forEach.call($("views").children,function(x){x.setAttribute("aria-pressed",String(x===b))});
  render();
});
$("q").addEventListener("input",function(ev){st.q=ev.target.value;render()});
render();
})();
</script>
</body>
</html>
